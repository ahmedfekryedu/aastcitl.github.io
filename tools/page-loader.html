<style id="citl-boot-style">
@font-face{font-family:CITLBootCairo;src:url('/assets/fonts/cairo-arabic.woff2') format('woff2');font-style:normal;font-weight:200 1000;font-display:block}
html.citl-page-booting{background:radial-gradient(ellipse at 15% 15%,#52618a 0,transparent 60%),radial-gradient(ellipse at 90% 85%,#54516e 0,transparent 55%),#303c60!important;min-height:100%;overflow:hidden!important}
html.citl-page-booting body{background:#303c60!important}
html.citl-page-booting::-webkit-scrollbar-track{background:#303c60}
html.citl-page-booting::-webkit-scrollbar-corner{background:#303c60}
html.citl-page-booting body>*:not(script):not(#global-loader){pointer-events:none!important;user-select:none}
@media(min-width:1024px){html{scrollbar-gutter:stable}}
#global-loader.citl-unified-loader.hidden{display:none}#global-loader.citl-unified-loader.flex{display:flex}
#global-loader.citl-unified-loader{position:fixed!important;inset:auto!important;left:0!important;top:0!important;width:var(--citl-load-width,100vw)!important;height:var(--citl-load-height,100svh)!important;z-index:99999;margin:0!important;padding:16px;box-sizing:border-box;transform:none!important;animation:none!important;transition:none!important;align-items:center;justify-content:center;direction:rtl;font-family:CITLBootCairo,sans-serif;background:transparent;isolation:isolate;color-scheme:only light;forced-color-adjust:none}
html.citl-page-booting #global-loader{display:flex!important;visibility:visible!important;opacity:1!important;pointer-events:auto!important}
html.citl-page-booting #global-loader::before,html.citl-navigation-loading #global-loader::before{background:radial-gradient(ellipse at 15% 15%,#52618a 0,transparent 60%),radial-gradient(ellipse at 90% 85%,#54516e 0,transparent 55%),#303c60!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
#global-loader.citl-unified-loader::before{content:"";position:fixed;inset:-3px;z-index:-1;background:radial-gradient(ellipse at 15% 15%,#52618a 0,transparent 60%),radial-gradient(ellipse at 90% 85%,#54516e 0,transparent 55%),#303c60;backdrop-filter:none;-webkit-backdrop-filter:none;pointer-events:auto}
#global-loader.citl-unified-loader>.relative{position:absolute!important;inset:0!important;margin:auto!important;width:348px!important;height:278px!important;max-width:calc(100% - 32px)!important;max-height:calc(100% - 24px);box-sizing:border-box!important;padding:20px!important;overflow:auto;transform:none!important;animation:none!important;transition:none!important;border-radius:24px;border:1px solid #ffffffb3;background:linear-gradient(155deg,#fdfcf8,#eef1f8)!important;color:#2a3475!important;box-shadow:0 24px 80px #09102b55,inset 0 1px 0 #fff;text-align:center;display:flex;flex-direction:column;align-items:center;isolation:isolate;color-scheme:only light}
#global-loader>.relative::before{content:'CITL SMART SYSTEM';display:block;flex-shrink:0;font:700 10px/16px Arial,sans-serif;letter-spacing:2px;color:#626b89;margin-bottom:4px}
#global-loader>.relative::after{content:'';position:absolute;bottom:16px;right:22px;left:22px;height:3px;border-radius:6px;background:linear-gradient(90deg,#e1e5ef 0 30%,#f3a628 42% 57%,#2a3475 62%,#e1e5ef 74%);background-size:240% 100%;animation:citl-load-track 2s ease-in-out infinite}
#global-loader.citl-unified-loader img{display:block;width:142px!important;height:114px!important;max-width:100%;object-fit:contain;flex-shrink:0;margin:0!important;background:transparent!important;opacity:1!important;mix-blend-mode:normal!important;filter:url(#citl-loader-logo-alpha)!important}
#global-loader h3,#global-loader p,#global-loader button,#global-loader h3 *{font-family:CITLBootCairo,sans-serif!important}
#global-loader.citl-unified-loader h3{display:flex;align-items:baseline;justify-content:center;gap:6px;color:#2a3475;font-size:20px;font-weight:900;font-variation-settings:"wght" 900;line-height:1.6;margin:8px 0 0!important;letter-spacing:0;flex-shrink:0}
#global-loader.citl-unified-loader #loader-text{color:#66718b;font-size:12px;font-weight:600;line-height:1.8;min-height:36px;max-height:40px;overflow:auto;max-width:100%;margin:4px 0 0!important;overflow-wrap:anywhere}
html:not(.citl-loader-font-ready) #global-loader h3,html:not(.citl-loader-font-ready) #global-loader p{visibility:hidden}
#global-loader [data-boot-retry]{position:absolute;bottom:30px;left:18px;right:18px;margin:0;padding:5px;border:1px solid #cdd4e4;border-radius:8px;background:#f5f7fb;color:#2a3475;font-size:10px;cursor:pointer}
.citl-loader-dots{display:inline-flex;direction:rtl;width:1.15em;flex:none;justify-content:space-between}.citl-loader-dots i{font-style:normal;opacity:0;animation:citl-dot-one 1.5s linear infinite}.citl-loader-dots i:nth-child(2){animation-name:citl-dot-two}.citl-loader-dots i:nth-child(3){animation-name:citl-dot-three}
@keyframes citl-dot-one{0%,15%,100%{opacity:0}20%,90%{opacity:1}}@keyframes citl-dot-two{0%,40%,100%{opacity:0}45%,90%{opacity:1}}@keyframes citl-dot-three{0%,65%,100%{opacity:0}70%,90%{opacity:1}}
@keyframes citl-load-track{from{background-position:0 0}to{background-position:100% 0}}
@media(max-width:767px){#global-loader.citl-unified-loader>.relative{width:304px!important;height:260px!important;padding:18px!important;border-radius:22px}#global-loader.citl-unified-loader img{width:132px!important;height:106px!important}#global-loader.citl-unified-loader h3{font-size:18px;margin-top:6px!important}#global-loader.citl-unified-loader #loader-text{font-size:11px}}
@media(prefers-reduced-motion:reduce){.citl-loader-dots i{animation:none;opacity:1}#global-loader>.relative::after{animation:none}}
#global-loader>.relative:has([data-boot-retry]:not([hidden])) #loader-text{visibility:hidden}

html.citl-navigation-loading #global-loader::before,
#global-loader.citl-unified-loader::before{

 inset:-18px;filter:blur(2px);pointer-events:auto;
}
#global-loader.citl-unified-loader>.relative{
 background:linear-gradient(155deg,rgba(253,252,248,.95),rgba(238,241,248,.92))!important;
 backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
}
@media(max-width:767px){
 html.citl-page-booting #global-loader::before,html.citl-navigation-loading #global-loader::before,#global-loader.citl-unified-loader::before{background-position:62% center!important;}
}
