<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="theme-color" content="#2A3475">
    <meta name="apple-mobile-web-app-status-bar-style" content="#2A3475">
    
    <title>كلية النقل الدولي واللوجستيات - لجان الامتحانات النهائية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f8f9fa;
            -webkit-tap-highlight-color: transparent; /* يمنع الوميض الأزرق المزعج عند اللمس في الموبايل */
        }
        
        /* تصميم الاسكرول الملون الاحترافي */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #2A3475; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #F3A628; }

        .pulse-loader { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
        
        /* تأثير النبض للامتحان الشغال الآن */
        .live-exam-glow {
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.25);
            border-color: #4ade80 !important;
        }
        .live-dot { animation: ping 1.5s cubic-bezier(0, 0, 0.2, 1) infinite; }
    </style>
</head>
<body class="min-h-screen flex flex-col h-[100dvh]">

    <header class="relative bg-[#1c2352] text-white py-3 px-4 rounded-b-[2rem] shadow-lg shrink-0 z-20 overflow-hidden">
        
        <div class="absolute top-0 right-0 w-32 h-32 bg-[#F3A628] opacity-20 rounded-full blur-3xl -mr-10 -mt-10 pointer-events-none"></div>
        <div class="absolute bottom-0 left-0 w-24 h-24 bg-blue-500 opacity-20 rounded-full blur-2xl -ml-10 -mb-10 pointer-events-none"></div>

        <div class="flex justify-between items-center relative z-10 gap-2">
            <div class="flex flex-col justify-center flex-1">
                <div class="inline-flex items-center bg-white/10 border border-white/10 rounded-full px-2 py-0.5 mb-1.5 w-fit backdrop-blur-sm shadow-sm">
                    <i class="fas fa-university text-[#F3A628] text-[8px] ml-1"></i>
                    <span class="text-white/90 text-[8px] font-bold tracking-wide">الأكاديمية العربية للعلوم والتكنولوجيا والنقل البحري</span>
                </div>
                
                <h1 class="text-base font-black tracking-tight text-white leading-tight drop-shadow-md">
                    لجان الامتحانات النهائية
                </h1>
                <p class="text-[10px] text-gray-300 font-semibold mt-0.5 flex items-center gap-1 opacity-90">
                    كلية النقل الدولي واللوجستيات <span class="w-1 h-1 rounded-full bg-[#F3A628]/50 inline-block"></span> CITL
                </p>
            </div>
            
            <div id="current-date" class="bg-gradient-to-br from-[#F3A628] to-[#d48a1b] px-3 py-1.5 rounded-2xl shadow-md flex flex-col items-center justify-center min-w-[65px] shrink-0 border border-white/20 transform hover:scale-105 transition-transform">
                </div>
        </div>

        <div class="absolute bottom-0 left-0 w-full h-[3px] bg-gradient-to-r from-transparent via-[#F3A628] to-transparent opacity-90"></div>
    </header>

    <main class="flex-1 w-full max-w-md mx-auto px-3 pt-4 pb-2 overflow-y-auto custom-scrollbar relative z-10">
        <div id="loader" class="text-center mt-12 text-[#2A3475] pulse-loader">
            <div class="w-14 h-14 bg-white rounded-full flex items-center justify-center mx-auto shadow-sm mb-3 border border-gray-100">
                <i class="fas fa-spinner fa-spin text-2xl text-[#F3A628]"></i>
            </div>
            <p class="text-sm font-bold text-gray-600">جاري إحضار اللجان وحالتها...</p>
        </div>

        <div id="exams-container" class="space-y-5 pb-4" style="display: none;"></div>
    </main>

    <footer class="bg-white py-3 border-t border-gray-200 shrink-0 mt-auto shadow-[0_-5px_15px_-3px_rgba(0,0,0,0.05)] z-20">
        <div class="flex flex-col items-center justify-center gap-1.5 text-center px-4">
            <span class="text-[9px] font-bold text-gray-500">جميع الحقوق محفوظة لكلية النقل الدولي واللوجستيات © 2026</span>
            <span class="text-[9px] font-black text-[#2A3475] bg-gray-50 border border-gray-200 px-3 py-1 rounded-full shadow-sm">
                <i class="fas fa-code text-[#F3A628] ml-1"></i> تطوير وإدارة: أ. أحمد فكري (فني معمل الحاسب)
            </span>
        </div>
    </footer>

    <script>
        const SUPABASE_URL = 'https://xgqukdbonzukxrpjovmb.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhncXVrZGJvbnp1a3hycGpvdm1iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM4OTg4MDMsImV4cCI6MjA3OTQ3NDgwM30.3-70d7uB-zjVF7Jfr8ZjITT7suYPo3EWsYngO-sFVqM';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function getExamStatus(startStr, endStr) {
            const now = new Date();
            const cairoTime = new Date(now.toLocaleString("en-US", { timeZone: "Africa/Cairo" }));
            const currentMins = cairoTime.getHours() * 60 + cairoTime.getMinutes();

            const [sH, sM] = startStr.split(':').map(Number);
            const startMins = sH * 60 + sM;

            const [eH, eM] = endStr.split(':').map(Number);
            const endMins = eH * 60 + eM;

            if (currentMins >= endMins) {
                return { 
                    type: 'ended', 
                    cardClass: 'opacity-60 grayscale-[40%] bg-gray-100', 
                    badge: `<span class="bg-gray-200 text-gray-500 px-2 py-0.5 rounded text-[10px] font-bold absolute top-2 left-2 z-10 border border-gray-300 shadow-sm"><i class="fas fa-check-double ml-1"></i>انتهى</span>` 
                };
            } else if (currentMins >= startMins && currentMins < endMins) {
                return { 
                    type: 'now', 
                    cardClass: 'live-exam-glow bg-white relative', 
                    badge: `<span class="bg-green-100 text-green-800 px-2 py-0.5 rounded text-[10px] font-bold absolute top-2 left-2 z-10 border border-green-300 shadow-sm flex items-center gap-1.5"><span class="relative flex h-2 w-2"><span class="live-dot absolute inline-flex h-full w-full rounded-full bg-green-500 opacity-75"></span><span class="relative inline-flex rounded-full h-2 w-2 bg-green-600"></span></span>جاري الآن</span>` 
                };
            } else {
                return { 
                    type: 'upcoming', 
                    cardClass: 'bg-white', 
                    badge: `<span class="bg-blue-50 text-blue-600 px-2 py-0.5 rounded text-[10px] font-bold absolute top-2 left-2 z-10 border border-blue-200 shadow-sm"><i class="fas fa-hourglass-half ml-1"></i>قريباً</span>` 
                };
            }
        }

        async function fetchTodayExams() {
            const container = document.getElementById('exams-container');
            const loader = document.getElementById('loader');
            const dateLabel = document.getElementById('current-date');

            try {
                const now = new Date();
                let todayStr = new Intl.DateTimeFormat('en-CA', { timeZone: 'Africa/Cairo' }).format(now);
                
                dateLabel.innerHTML = `<span class="text-[11px] font-black text-[#2A3475] mb-0.5 drop-shadow-sm">${new Date(todayStr).toLocaleDateString('ar-EG', { weekday: 'long' })}</span><span class="text-[10px] font-english font-bold text-[#2A3475]/90 bg-white/30 px-2 py-0.5 rounded shadow-sm">${new Date(todayStr).toLocaleDateString('en-GB', { day: '2-digit', month: 'short' })}</span>`;

                const { data: exams, error } = await supabaseClient
                    .from('exam_schedule')
                    .select('*')
                    .eq('exam_date', todayStr)
                    .order('start_time');

                if (error) throw error;
                loader.style.display = 'none';

                if (!exams || exams.length === 0) {
                    container.style.display = 'block';
                    container.innerHTML = `
                        <div class="bg-white rounded-2xl p-6 text-center shadow-sm border border-gray-100 mt-2">
                            <div class="w-16 h-16 bg-gray-50 rounded-full flex items-center justify-center mx-auto mb-3 text-gray-300">
                                <i class="fas fa-calendar-check text-3xl"></i>
                            </div>
                            <h3 class="text-base font-black text-[#2A3475] mb-1">لا توجد لجان امتحانات اليوم</h3>
                            <p class="text-[11px] text-gray-500 font-bold">نتمنى لكم التوفيق والنجاح!</p>
                        </div>`;
                    return;
                }

                container.style.display = 'block';
                
                const groupedExams = {};
                exams.forEach(exam => {
                    const timeKey = `${exam.start_time.substring(0,5)} - ${exam.end_time.substring(0,5)}`;
                    if (!groupedExams[timeKey]) groupedExams[timeKey] = [];
                    groupedExams[timeKey].push(exam);
                });

                let periodsArray = [];
                for (const [time, examsGroup] of Object.entries(groupedExams)) {
                    const sampleExam = examsGroup[0];
                    const status = getExamStatus(sampleExam.start_time, sampleExam.end_time);
                    
                    let priority = 3; 
                    if (status.type === 'now') priority = 1; 
                    else if (status.type === 'upcoming') priority = 2; 

                    const [sH, sM] = sampleExam.start_time.split(':').map(Number);
                    
                    periodsArray.push({
                        timeLabel: time,
                        exams: examsGroup,
                        priority: priority,
                        startMins: sH * 60 + sM
                    });
                }

                periodsArray.sort((a, b) => {
                    if (a.priority !== b.priority) return a.priority - b.priority;
                    return a.startMins - b.startMins;
                });

                let html = '';
                periodsArray.forEach(period => {
                    html += `
                        <div class="mb-5">
                            <div class="flex items-center gap-2 mb-2.5 px-1">
                                <div class="bg-[#2A3475] text-white p-1.5 rounded-md shadow-sm"><i class="fas fa-clock text-[10px] block"></i></div>
                                <h3 class="font-bold text-[13px] text-[#2A3475] pt-1">الفترة: <span class="font-english bg-white px-2 py-0.5 rounded border border-gray-200 ml-1 shadow-sm">${period.timeLabel}</span></h3>
                                <div class="flex-1 h-px bg-gradient-to-l from-transparent to-gray-300 ml-2"></div>
                            </div>
                            <div class="space-y-3">
                    `;

                    period.exams.forEach((exam, index) => {
                        const isEnglish = exam.course_language === 'E';
                        const langBar = isEnglish ? 'bg-blue-500' : 'bg-[#F3A628]';
                        const langBadge = isEnglish ? 'bg-blue-50 text-blue-700 border-blue-200' : 'bg-orange-50 text-orange-700 border-orange-200';
                        const langText = isEnglish ? 'إنجليزي (E)' : 'عربي (A)';
                        
                        const status = getExamStatus(exam.start_time, exam.end_time);
                        const alternatingBg = (index % 2 === 0) ? '' : 'bg-slate-50';
                        const finalBgClass = status.type === 'upcoming' ? alternatingBg : status.cardClass;

                        html += `
                                <div class="rounded-xl shadow-sm border border-gray-200 flex overflow-hidden relative transition hover:shadow-md ${finalBgClass}">
                                    ${status.badge} 
                                    
                                    <div class="w-2 ${langBar} shrink-0"></div>
                                    
                                    <div class="flex-1 p-3.5 pt-8 border-l border-dashed border-gray-200 flex flex-col justify-center">
                                        <div class="flex flex-wrap gap-1.5 mb-2">
                                            <span class="bg-gray-100 text-gray-700 text-[10px] font-bold px-2 py-0.5 rounded border border-gray-200">فرقة ${exam.academic_level}</span>
                                            <span class="bg-gray-100 text-gray-700 text-[10px] font-bold px-2 py-0.5 rounded border border-gray-200">مجموعة ${exam.group_number}</span>
                                            <span class="bg-gray-50 text-gray-600 border border-gray-200 text-[10px] font-bold px-2 py-0.5 rounded font-english">${exam.course_code}</span>
                                            <span class="${langBadge} border text-[10px] font-black px-2 py-0.5 rounded">${langText}</span>
                                        </div>
                                        
                                        <h4 class="text-[15px] font-black text-[#2A3475] leading-snug mb-1.5">${exam.course_name}</h4>
                                        <p class="text-[11px] text-gray-500 font-bold truncate mt-auto">
                                            <i class="fas fa-user-tie text-[#F3A628] ml-1 opacity-80 text-sm"></i>د. ${exam.instructor.replace(/^(د\/|أ\.د\/)/, '')}
                                        </p>
                                    </div>
                                    
                                    <div class="w-[85px] flex flex-col items-center justify-center p-2 shrink-0 relative overflow-hidden bg-gray-50/50">
                                        <i class="fas fa-door-open text-gray-200 absolute -right-1 -top-1 text-4xl opacity-50"></i>
                                        <span class="text-[9px] font-bold text-gray-500 mb-1 relative z-10">قاعة / لجنة</span>
                                        <span class="text-[17px] font-black ${status.type === 'ended' ? 'text-gray-500' : 'text-green-600'} font-english text-center relative z-10 drop-shadow-sm">${exam.room_name}</span>
                                    </div>
                                </div>
                        `;
                    });

                    html += `</div></div>`;
                });
                container.innerHTML = html;
            } catch (err) {
                console.error(err);
            }
        }

        fetchTodayExams();
        setInterval(fetchTodayExams, 60000);
    </script>
</body>
</html>
